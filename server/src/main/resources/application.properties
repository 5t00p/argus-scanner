spring.application.name=argusScanner

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:8889/ArgusScanner}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=classpath:argus-keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_PASSWORD:changeit}
server.ssl.key-alias=argus

server.port=8080
spring.web.resources.static-locations=file:../dashboard/,file:./dashboard/

# Login: set AUTH_ENABLED=false to test the API without logging in. First admin is admin@argus.local
argus.auth.enabled=${AUTH_ENABLED:true}
argus.admin.password=${ADMIN_PASSWORD:changeme}
