<!DOCTYPE html>
<html>
<head>
    <title>Argus - Scan Findings</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header>
        <h1>Argus</h1>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="cases.html">Cases</a>
        <a href="devices.html">Devices</a>
        <a href="scans.html">Scans</a>
        <a href="reports.html">Reports</a>
        <a href="signatures.html">Signatures</a>
        <a href="#" onclick="logout(); return false;">Log out</a>
    </nav>

    <main>
        <h2>Scan Findings</h2>

        <p id="scanContext">Loading scan...</p>

        <section class="scan-history">
            <h3>Flagged Apps</h3>

            <table>
                <thead>
                    <tr>
                        <th>App</th>
                        <th>Risk</th>
                        <th>Why it was flagged</th>
                    </tr>
                </thead>

                <tbody id="findingsBody">
                    <tr>
                        <td colspan="3">Loading findings...</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <p>
            <a href="scans.html">Back to Scan History</a>
        </p>
    </main>

    <script src="js/api.js" defer></script>
    <script src="js/findings.js" defer></script>

</html>
