<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Argus - Case Management</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Argus</h1>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="cases.html">Cases</a>
        <a href="devices.html">Devices</a>
        <a href="scans.html">Scans</a>
        <a href="reports.html">Reports</a>
        <a href="signatures.html">Signatures</a>
        <a href="#" onclick="logout(); return false;">Log out</a>
    </nav>

    <main>
        <h2>Cases</h2>
        <p>Each survivor an advocate is helping gets a case. Close a case when the work is done; closed cases stay on record.</p>

        <section class="card">
            <h3>Open a New Case</h3>
            <form id="newCaseForm" class="inline-form">
                <label>
                    Survivor reference
                    <input type="text" id="newSurvivorRef" maxlength="100" placeholder="e.g. SR-0042" required>
                </label>
                <button type="submit">Open case</button>
            </form>
            <p id="caseStatus" class="form-status" role="status"></p>
        </section>

        <section class="scan-history">
            <h3>Existing Cases</h3>

            <table>
                <thead>
                    <tr>
                        <th>Case ID</th>
                        <th>Survivor Reference</th>
                        <th>Status</th>
                        <th>Opened</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="casesBody">
                    <tr>
                        <td colspan="5">Loading cases...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="js/api.js" defer></script>
    <script src="js/cases.js" defer></script>

</body>
</html>
