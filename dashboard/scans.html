<!DOCTYPE html>
<html>
<head>
    <title>Argus - Scans</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1>Argus - Dashboard</h1>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="cases.html">Cases</a>
        <a href="scans.html">Scans</a>
        <a href="reports.html">Reports</a>
        <a href="signatures.html">Signatures</a>
    </nav>
    
<main>
    <h2>Scan Management</h2>


    <section class="scan-upload">
        <h2>Upload Scan Results</h2>

        <p>Select a JSON file generated by the Argus Android scanner.</p>

        <form id="uploadScanForm">
            <input
                type="file"
                id="scanFile"
                accept=".json,application/json"
                required
            >

            <button type="submit" id="uploadScan">
                Upload Scan
            </button>
        </form>

        <p id="uploadStatus">No file uploaded.</p>
    </section>

    <section class="scan-history">
        <h2>Previous Scans</h2>

        <table id="scanHistoryTable">
            <thead>
                <tr>
                    <th>Scan ID</th>
                    <th>Date</th>
                    <th>Device ID</th>
                    <th>Status</th>
                    <th>Findings</th>
                </tr>
            </thead>

            <tbody id="scanHistoryBody">
                <tr>
                    <td colspan="5">No scans loaded.</td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

    <script src="js/api.js" defer></script>
    <script src="js/main.js" defer></script>
</body>
</html>
